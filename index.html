<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז הלמידה | אינקוטרמס, FOCUS ויצוא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@300;400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2942;
    --navy-deep:#081826;
    --teal:#1B6B78;
    --brass:#C9A227;
    --brass-light:#E4C55E;
    --paper:#F6F3EC;
    --paper-dim:#EDE8DB;
    --ink:#1B1B18;
    --ink-soft:#5B5A52;
    --line:#D8D2C0;
    --ok:#3B7A57;
    --err:#B5462E;
    --radius:4px;
    --shadow: 0 10px 30px rgba(8,24,38,.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Assistant',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    letter-spacing:.2px;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--brass); outline-offset:2px;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--navy);
    color:var(--paper);
    border-bottom:3px solid var(--brass);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .brand-seal{
    width:38px;height:38px;border-radius:50%;
    border:2px solid var(--brass);
    display:flex;align-items:center;justify-content:center;
    font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:15px;
    color:var(--brass-light); flex:none;
  }
  .brand-text{font-family:'Frank Ruhl Libre',serif; font-size:19px; font-weight:700;}
  .brand-text span{display:block; font-family:'Assistant',sans-serif; font-weight:400; font-size:11.5px; color:#B9C4CE; letter-spacing:.5px;}
  .top-actions{display:flex; gap:10px;}
  .top-actions button{
    background:transparent; border:1px solid rgba(246,243,236,.35);
    color:var(--paper); padding:8px 14px; border-radius:var(--radius); font-size:14px;
  }
  .top-actions button:hover{border-color:var(--brass); color:var(--brass-light);}

  main{max-width:1180px; margin:0 auto; padding:0 24px 90px;}

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 0 46px; display:flex; align-items:center; gap:48px; flex-wrap:wrap;
  }
  .hero-text{flex:1 1 420px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:1.6px; color:var(--teal); font-weight:700;
    text-transform:uppercase; margin-bottom:16px;
  }
  .eyebrow::before{content:''; width:22px; height:2px; background:var(--brass);}
  .hero h1{font-size:clamp(30px,4.2vw,48px); line-height:1.18; color:var(--navy);}
  .hero p{margin-top:18px; font-size:17px; color:var(--ink-soft); max-width:52ch;}
  .hero-cta{margin-top:26px; display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:var(--radius); font-weight:600; font-size:15px;
    border:1px solid transparent;
  }
  .btn-primary{background:var(--navy); color:var(--paper);}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-ghost{border-color:var(--navy); color:var(--navy);}
  .btn-ghost:hover{background:var(--navy); color:var(--paper);}

  .hero-seal{
    flex:none; width:190px; height:190px; border-radius:50%;
    border:3px double var(--navy);
    display:flex; align-items:center; justify-content:center; text-align:center;
    position:relative; background:radial-gradient(circle at 50% 40%, #fff, var(--paper-dim));
    box-shadow: var(--shadow);
  }
  .hero-seal-inner{
    width:150px; height:150px; border-radius:50%; border:1px solid var(--brass);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--navy);
  }
  .hero-seal-inner strong{font-family:'Frank Ruhl Libre',serif; font-size:22px;}
  .hero-seal-inner span{font-size:11px; letter-spacing:1.5px; color:var(--teal); font-weight:700;}

  /* ---------- Module grid ---------- */
  .section-head{margin:54px 0 22px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .section-head h2{font-size:26px; color:var(--navy);}
  .section-head p{color:var(--ink-soft); font-size:14.5px; margin:0;}

  .modules{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px;}
  .module-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 24px; display:flex; flex-direction:column; gap:14px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative; overflow:hidden;
  }
  .module-card::before{
    content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--line);
    transition:background .18s ease;
  }
  .module-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--navy);}
  .module-card:hover::before{background:var(--brass);}
  .module-num{
    font-family:'Frank Ruhl Libre',serif; font-size:34px; color:var(--brass); font-weight:700; line-height:1;
  }
  .module-card h3{font-size:19px; color:var(--navy); line-height:1.35;}
  .module-card p{margin:0; font-size:14px; color:var(--ink-soft);}
  .module-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:10px;}
  .chip{
    font-size:11.5px; padding:4px 9px; border-radius:20px; background:var(--paper-dim);
    color:var(--ink-soft); border:1px solid var(--line);
  }
  .module-go{font-size:13.5px; font-weight:700; color:var(--teal); display:flex; align-items:center; gap:6px;}

  /* ---------- Module detail page ---------- */
  .crumb{margin:28px 0 8px; font-size:13.5px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .crumb button{background:none; border:none; color:var(--teal); font-weight:700; font-size:13.5px; padding:0;}
  .m-head{
    display:flex; gap:22px; align-items:flex-start; padding:20px 0 34px; border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .m-head .module-num{font-size:44px;}
  .m-head h1{color:var(--navy); font-size:clamp(24px,3.4vw,34px); line-height:1.25;}
  .m-head p{color:var(--ink-soft); margin-top:10px; max-width:70ch; font-size:15.5px;}

  .toc{display:flex; gap:10px; flex-wrap:wrap; margin:26px 0 8px;}
  .toc a{
    font-size:13.5px; padding:8px 14px; border-radius:20px; background:#fff; border:1px solid var(--line); color:var(--navy);
  }
  .toc a:hover{border-color:var(--brass); color:var(--teal);}

  .block{margin-top:44px;}
  .block-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .block-icon{
    width:34px; height:34px; border-radius:50%; background:var(--navy); color:var(--brass-light);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;
  }
  .block-head h3{font-size:19px; color:var(--navy);}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px;
  }

  /* ---------- Written content block ---------- */
  .content-block .lead{font-size:15.5px; color:var(--ink-soft); margin:0 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .content-block h4{
    font-family:'Frank Ruhl Libre',serif; color:var(--navy); font-size:18px;
    margin:28px 0 10px; padding-inline-start:14px; border-inline-start:3px solid var(--brass);
  }
  .content-block h4:first-of-type{margin-top:0;}
  .content-block p{margin:0 0 12px; font-size:14.5px; color:var(--ink);}
  .content-block ul{margin:0 0 14px; padding-inline-start:22px;}
  .content-block li{margin-bottom:7px; font-size:14.5px;}
  .content-block li strong{color:var(--navy);}
  .content-block .rule{
    background:var(--paper-dim); border-inline-start:3px solid var(--err); border-radius:4px;
    padding:12px 16px; margin:14px 0; font-size:13.8px; color:#5b3323;
  }
  .content-block .rule strong{color:var(--err);}
  .content-block .flow{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0 22px; font-size:13.5px;
  }
  .content-block .flow span{
    background:var(--navy); color:var(--paper); padding:6px 12px; border-radius:20px; font-weight:600;
  }
  .content-block .flow em{color:var(--brass); font-style:normal; font-weight:700;}

  /* placeholder states for media not yet uploaded */
  .placeholder{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:30px 20px;
    text-align:center; color:var(--ink-soft); background:var(--paper-dim);
  }
  .placeholder strong{display:block; color:var(--navy); font-size:15px; margin-bottom:6px;}
  .placeholder small{display:block; margin-top:8px; font-size:12.5px; color:#8b8878;}

  video, audio{width:100%; border-radius:var(--radius);}
  .infographic-frame img{width:100%; display:block; border-radius:var(--radius);}

  /* ---------- Built infographic component (hand-drawn sketchbook style) ---------- */
  .infographic-wrap{
    position:relative; padding:26px 22px 20px;
    background:
      radial-gradient(circle at 8px 8px, rgba(15,41,66,.05) 1px, transparent 1.4px) 0 0/16px 16px,
      #FBF8F0;
    border:1px solid var(--line); border-radius:10px;
  }
  .infographic-wrap::before{
    content:'✦'; position:absolute; top:6px; left:14px; font-size:20px; color:var(--brass);
    transform:rotate(14deg);
  }
  .infographic-wrap::after{
    content:'⚙'; position:absolute; top:8px; right:16px; font-size:18px; color:var(--teal); opacity:.55;
    transform:rotate(-16deg);
  }
  .info-banner{
    position:relative; background:var(--navy); color:var(--paper);
    padding:22px 26px; margin-bottom:26px; text-align:center;
    border:2.5px solid var(--navy-deep);
    border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    transform:rotate(-0.4deg);
    box-shadow:5px 5px 0 rgba(201,162,39,.35);
  }
  .info-banner::before{
    content:'★'; position:absolute; bottom:-14px; left:22px; font-size:15px; color:var(--brass-light);
    transform:rotate(-12deg);
  }
  .info-banner::after{
    content:'➜'; position:absolute; bottom:-13px; right:22px; font-size:15px; color:#A9BAC4;
    transform:rotate(10deg);
  }
  .info-banner h4{
    font-family:'Suez One', 'Frank Ruhl Libre', serif; font-weight:400; font-size:21px;
    color:var(--paper); margin:0 0 8px; letter-spacing:.3px;
  }
  .info-banner p{margin:0; font-size:13.5px; color:#C7D2DB;}
  .info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px 18px; margin-bottom:22px;}
  .info-card{
    background:#fff; border:2px solid var(--navy); padding:19px 18px 17px;
    position:relative;
    border-radius:225px 16px 220px 16px/16px 220px 16px 225px;
    box-shadow:4px 4px 0 var(--brass-light);
    transition:transform .15s ease;
  }
  .info-card:nth-child(odd){transform:rotate(-0.7deg);}
  .info-card:nth-child(even){transform:rotate(0.6deg);}
  .info-card:hover{transform:rotate(0deg) translateY(-2px);}
  .info-card .info-num{
    position:absolute; top:-14px; inset-inline-start:16px;
    width:28px; height:28px; border-radius:50%; background:var(--brass); color:var(--navy-deep);
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--navy-deep); transform:rotate(-6deg);
  }
  .info-card .info-icon{font-size:27px; margin-bottom:8px; display:block; transform:rotate(-3deg);}
  .info-card h5{font-family:'Suez One','Frank Ruhl Libre',serif; font-weight:400; color:var(--navy); font-size:16px; margin:0 0 8px;}
  .info-card p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .info-card ul{margin:6px 0 0; padding-inline-start:18px;}
  .info-card li{font-size:12.8px; color:var(--ink-soft); margin-bottom:4px;}
  .info-flowline{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    margin:2px 0 26px; font-size:12.5px; font-weight:700;
  }
  .info-flowline span{
    background:var(--navy); color:var(--paper); padding:7px 14px;
    border-radius:225px 15px 220px 15px/15px 220px 15px 225px;
    border:1.5px dashed var(--brass-light);
  }
  .info-flowline em{color:var(--brass); font-style:normal; font-size:15px;}
  .info-warning{
    background:#FBEBE7; border:2px dashed var(--err);
    border-radius:18px 190px 18px 190px/190px 18px 190px 18px;
    padding:15px 20px; margin-top:8px; font-size:13px; color:#7A2F1C;
    transform:rotate(-0.3deg);
  }
  .info-warning strong{display:block; margin-bottom:2px; color:var(--err); font-family:'Suez One',serif; font-weight:400; font-size:14.5px;}
  .info-table{width:100%; border-collapse:collapse; font-size:12.8px; margin-top:6px; border:2px solid var(--navy); border-radius:8px; overflow:hidden;}
  .info-table th{background:var(--navy); color:var(--paper); padding:9px 10px; text-align:right; font-weight:700;}
  .info-table td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--ink);}
  .info-table tr:nth-child(even) td{background:var(--paper-dim);}
  .info-section-title{
    display:inline-block; font-family:'Suez One','Frank Ruhl Libre',serif; font-weight:400;
    color:var(--navy); font-size:16.5px; margin:26px 0 14px; padding:5px 16px;
    border:2px dashed var(--brass); border-radius:225px 15px 220px 15px/15px 220px 15px 225px;
    background:#fff; transform:rotate(-0.6deg);
  }

  /* ---------- Flashcards ---------- */
  .flash-wrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
  .flash-card{
    width:100%; max-width:520px; height:230px; perspective:1200px;
  }
  .flash-inner{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;
  }
  .flash-card.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:8px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;
    font-size:17px; box-shadow:var(--shadow);
  }
  .flash-front{background:var(--navy); color:var(--paper);}
  .flash-back{background:var(--brass-light); color:var(--navy-deep); transform:rotateY(180deg); font-weight:600;}
  .flash-controls{display:flex; align-items:center; gap:16px;}
  .flash-controls button{
    background:#fff; border:1px solid var(--line); width:38px; height:38px; border-radius:50%; font-size:16px; color:var(--navy);
  }
  .flash-controls button:hover{border-color:var(--navy);}
  .flash-counter{font-size:13.5px; color:var(--ink-soft); min-width:60px; text-align:center;}
  .flash-hint{font-size:12.5px; color:#8b8878;}

  /* ---------- Quiz ---------- */
  .quiz-progress{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
  .quiz-q{font-size:17px; font-weight:600; color:var(--navy); margin-bottom:16px;}
  .quiz-opts{display:flex; flex-direction:column; gap:10px;}
  .quiz-opt{
    text-align:right; padding:13px 16px; border:1px solid var(--line); border-radius:var(--radius);
    background:#fff; font-size:14.5px;
  }
  .quiz-opt:hover{border-color:var(--navy);}
  .quiz-opt.correct{border-color:var(--ok); background:#EAF4EE; color:#1e5136; font-weight:700;}
  .quiz-opt.wrong{border-color:var(--err); background:#FBEBE7; color:#7A2F1C; font-weight:700;}
  .quiz-opt[disabled]{cursor:default;}
  .quiz-footer{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
  .quiz-result{text-align:center; padding:30px 10px;}
  .quiz-result .score{font-family:'Frank Ruhl Libre',serif; font-size:44px; color:var(--brass); font-weight:700;}

  footer{border-top:1px solid var(--line); margin-top:70px; padding:26px 24px; text-align:center; color:var(--ink-soft); font-size:12.5px;}

  @media (max-width:640px){
    .hero{padding-top:36px; gap:28px;}
    .hero-seal{width:140px; height:140px;}
    .hero-seal-inner{width:110px; height:110px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="navigate('home')">
      <div class="brand-seal">EX</div>
      <div class="brand-text">מרכז הלמידה<span>אינקוטרמס · FOCUS · יצוא</span></div>
    </div>
    <div class="top-actions">
      <button onclick="navigate('home')">כל הנושאים</button>
    </div>
  </div>
</div>

<main id="app"></main>

<footer>מרכז למידה פנימי — אינקוטרמס, מערכת FOCUS, הצהרות יצוא ותעודות EUR.1 · לשימוש פנימי בלבד</footer>

<script>
/* ===================== DATA ===================== */
const MODULES = [
  {
    id: 1,
    title: "אינקוטרמס (Incoterms)",
    subtitle: "תנאי מכר בינלאומיים בשילוח",
    desc: "כללים בינלאומיים אחידים (בהוצאת ה-ICC) המגדירים את חלוקת האחריות, העלויות והסיכונים בין המוכר לקונה, ומשפיעים ישירות על תמחור, שטר המטען והערך המדווח למכס.",
    tags: ["בסיס תיאורטי", "סחר בינלאומי"],
    video: "media/module1-incoterms.mp4",
    infographicImg: "media/module1-infographic.png",
    podcast: "media/module1-podcast.m4a",
    content: `
      <p class="lead">Incoterms הם כללים בינלאומיים אחידים (בהוצאת ICC) המגדירים את חלוקת האחריות, העלויות והסיכונים בין המוכר (היצואן) לקונה (היבואן) בעסקה מסחרית. תנאי המכר משפיעים ישירות על התמחור, על שטר המטען (B/L / AWB) ועל הערך המדווח למכס בהצהרת היצוא/יבוא. התנאים מסווגים לארבע קבוצות לפי האות הראשונה בקיצור — E, F, C ו-D — המשקפות את מידת האחריות הגוברת של המוכר.</p>

      <h4>קבוצה E — יציאה (Departure): אחריות מינימלית למוכר</h4>
      <ul>
        <li><strong>EXW (Ex Works)</strong> — איסוף ממפעל המוכר. האחריות והעלויות של המוכר מסתיימות ברצפת המפעל שלו; הקונה נושא בכל העלויות והסיכונים מהמפעל ועד היעד הסופי, כולל הובלה יבשתית במוצא, מכס ומטען.</li>
      </ul>

      <h4>קבוצה F — הובלה ראשית לא שולמה על ידי המוכר</h4>
      <ul>
        <li><strong>FOB (Free on Board)</strong> — מסירה על סיפון האונייה, נפוץ בהובלה ימית. המוכר אחראי על ההובלה המקומית, שחרור ממכס יצוא וטעינת המטען על גבי האונייה/מטוס בנמל המוצא. מהרגע שהמטען על האונייה, כל העלויות והסיכונים (הובלה ימית/אווירית, ביטוח ומכס יבוא) עוברים לקונה.</li>
        <li><strong>FCA (Free Carrier)</strong> — המוכר מוסר את הטובין למוביל שצוין על ידי הקונה, במקום המוסכם; הסיכון עובר לקונה באותו רגע.</li>
      </ul>

      <h4>קבוצה C — הובלה ראשית שולמה על ידי המוכר</h4>

function navigate(route){
  location.hash = route;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function render(){
  const hash = location.hash.replace('#','') || 'home';
  const app = document.getElementById('app');

  /* In-page section anchors (e.g. content-2, video-3, quiz-5) used by the
     module TOC — these must scroll within the current module, not be
     treated as a top-level route (which would bounce back to home). */
  const sectionMatch = hash.match(/^(content|video|infographic|flashcards|quiz|podcast)-(\d+)$/);
  if(sectionMatch){
    const modId = parseInt(sectionMatch[2]);
    const mod = MODULES.find(m=>m.id===modId);
    if(mod){
      if(!document.getElementById(`content-${modId}`)){
        app.innerHTML = renderModule(mod);
        attachModuleHandlers(mod);
      }
      const target = document.getElementById(hash);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
  }

  if(hash.startsWith('module-')){
    const id = parseInt(hash.split('-')[1]);
    const mod = MODULES.find(m=>m.id===id);
    app.innerHTML = mod ? renderModule(mod) : renderHome();
    if(mod) attachModuleHandlers(mod);
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo(0,0);
}

/* ===================== FLASHCARDS LOGIC ===================== */
function attachModuleHandlers(m){
  let idx = 0;
  const cards = m.flashcards || [];
  const cardEl = document.getElementById(`flashcard-${m.id}`);
  const frontEl = document.getElementById(`flashfront-${m.id}`);
  const backEl = document.getElementById(`flashback-${m.id}`);
  const counterEl = document.getElementById(`flashcount-${m.id}`);
  const prevBtn = document.getElementById(`flashprev-${m.id}`);
  const nextBtn = document.getElementById(`flashnext-${m.id}`);

  function draw(){
    if(!cards.length){
      frontEl.textContent = "אין עדיין כרטיסיות לנושא זה";
      backEl.textContent = "";
      counterEl.textContent = "";
      return;
    }
    cardEl.classList.remove('flipped');
    frontEl.textContent = cards[idx].q;
    backEl.textContent = cards[idx].a;
    counterEl.textContent = `${idx+1} / ${cards.length}`;
  }
  cardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));
  prevBtn.addEventListener('click', ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); });
  nextBtn.addEventListener('click', ()=>{ idx = (idx+1)%cards.length; draw(); });
  draw();

  /* ===================== QUIZ LOGIC ===================== */
  const quiz = m.quiz || [];
  const quizCard = document.getElementById(`quizcard-${m.id}`);
  let qi = 0, score = 0, answered = false;

  function drawQuiz(){
    if(!quiz.length){
      quizCard.innerHTML = `<div class="placeholder"><strong>אין עדיין שאלון לנושא זה</strong></div>`;
      return;
    }
    if(qi >= quiz.length){
      quizCard.innerHTML = `
        <div class="quiz-result">
          <div class="score">${score} / ${quiz.length}</div>
          <p>תשובות נכונות</p>
          <button class="btn btn-primary" id="quizrestart-${m.id}">התחלה מחדש</button>
        </div>`;
      document.getElementById(`quizrestart-${m.id}`).addEventListener('click', ()=>{ qi=0; score=0; drawQuiz(); });
      return;
    }
    const q = quiz[qi];
    answered = false;
    quizCard.innerHTML = `
      <div class="quiz-progress">שאלה ${qi+1} מתוך ${quiz.length}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div class="quiz-footer">
        <span></span>
        <button class="btn btn-ghost" id="quiznext-${m.id}" style="display:none;">לשאלה הבאה →</button>
      </div>
    `;
    const opts = quizCard.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        const chosen = parseInt(btn.dataset.i);
        opts.forEach(b=>b.disabled = true);
        if(chosen === q.correct){
          btn.classList.add('correct');
          score++;
        } else {
          btn.classList.add('wrong');
          opts[q.correct].classList.add('correct');
        }
        document.getElementById(`quiznext-${m.id}`).style.display = 'inline-flex';
      });
    });
    document.getElementById(`quiznext-${m.id}`).addEventListener('click', ()=>{ qi++; drawQuiz(); });
  }
  drawQuiz();
}
</script>
